name: Set up relate-contrib
description: Node, pnpm, dependencies (the database from the registry) and Playwright browsers.
inputs:
  engine-version:
    description: A release of the database (@relate/relate-wasm) to try instead of the one the workspace catalog names. Empty means the catalog's.
    default: ""
  browsers:
    description: Playwright browsers to install, space separated.
    default: chromium firefox webkit
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4 # the version comes from "packageManager" in package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies with the database release from the registry
      shell: bash
      env:
        ENGINE_VERSION: ${{ inputs.engine-version }}
      run: |
        set -euo pipefail
        if [ -z "$ENGINE_VERSION" ]; then
          pnpm install --frozen-lockfile
          exit 0
        fi
        # the workspace's root tools first, to point the checkout at the database release (the working tree only); then everything
        pnpm install --filter . --frozen-lockfile
        pnpm exec tsx scripts/release/use-engine.ts "$ENGINE_VERSION"
        pnpm install --no-frozen-lockfile

    - name: Restore the Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.browsers }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Playwright browsers
      shell: bash
      run: pnpm --filter @relate/contrib-web exec playwright install --with-deps ${{ inputs.browsers }}
