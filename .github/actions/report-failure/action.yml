name: Report a failure as a GitHub issue
description: Open an issue, or comment on the open one with this label and title, so that a repeat failure does not open another. Used by the drift check and the engine-release lane.
inputs:
  title:
    description: The issue title. An open issue with the same label and exactly this title is reused.
    required: true
  label:
    description: The label that marks these issues. Created if it does not exist.
    required: true
  color:
    description: The label's colour, if it is created.
    default: d93f0b
  description:
    description: The label's description, if it is created.
    default: ""
  body:
    description: The issue body, or the comment on an existing issue.
    required: true
  github-token:
    description: "A token that may write issues. The workflow's own token needs the `issues: write` permission."
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Report the failure as a GitHub issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ISSUE_TITLE: ${{ inputs.title }}
        ISSUE_LABEL: ${{ inputs.label }}
        ISSUE_COLOR: ${{ inputs.color }}
        ISSUE_LABEL_DESCRIPTION: ${{ inputs.description }}
        ISSUE_BODY: ${{ inputs.body }}
      run: |
        set -u
        gh label create "$ISSUE_LABEL" --description "$ISSUE_LABEL_DESCRIPTION" --color "$ISSUE_COLOR" --force

        # One open issue at a time: a repeat failure comments on it instead of opening another.
        issue=$(gh issue list --label "$ISSUE_LABEL" --state open --json number,title \
          --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -1)
        if [ -n "$issue" ]; then
          printf '%s\n' "$ISSUE_BODY" | gh issue comment "$issue" --body-file -
          echo "Commented on existing issue #$issue"
        else
          printf '%s\n' "$ISSUE_BODY" | gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body-file -
        fi
