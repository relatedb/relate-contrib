# Tests that fail because of a known engine defect (ADR-013 2.6, amended 2026-11-20): the two catalog interruption tests tagged
# @engine-wal, which stop the worker while the engine creates a WAL segment (relatedb/relate#576). Nothing waits for them: not a merge,
# not `full`, not a release. They run nightly and on request, so the day the engine is fixed shows up here; then the tag and this
# workflow are removed.
name: engine-known

on:
  schedule:
    - cron: "27 3 * * *"
  workflow_dispatch:

concurrency:
  group: engine-known
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  known:
    name: known (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browser }}
      - run: pnpm -r build
      - run: pnpm run test:catalog-known --project=${{ matrix.browser }} --repeat-each=3
