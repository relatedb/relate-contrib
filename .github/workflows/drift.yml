# The drift check: does everything still agree with the core? Builds every package, type-checks adapters against the
# core's published types, runs every package's unit tests, and runs the core's conformance check over every adapter's
# conformance site. The same command runs locally: `pnpm test:drift`.
#
# Runs nightly on main (the check takes ~45 minutes, too slow to gate pull requests). A failure opens a GitHub
# issue, or comments on the one already open; a green run does nothing. `workflow_dispatch` allows a manual run,
# which reports failures in the same way.
name: drift

on:
  schedule:
    - cron: "17 3 * * *" # nightly at 03:17 UTC
  workflow_dispatch:

concurrency:
  group: drift-nightly
  cancel-in-progress: false # let a running check finish; it may be filing the issue

permissions:
  contents: read
  issues: write # to file and comment on drift-failure issues

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ISSUE_TITLE: "Drift check failed on main"
  ISSUE_LABEL: drift

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0 # the Next adapter's scope test reads commit ranges
      - uses: ./.github/actions/setup
      - run: pnpm run test:drift
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: drift-reports
          path: |
            packages/*/reports
            packages/*/test-results
          if-no-files-found: ignore

      - name: Report the failure as a GitHub issue
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: ${{ env.ISSUE_TITLE }}
          label: ${{ env.ISSUE_LABEL }}
          description: Nightly drift check failures
          body: |
            The nightly drift check failed.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit: ${{ github.sha }}

            See the run's logs and the drift-reports artifact for what broke. This issue is updated by later
            failing runs; close it once main is green again.
