<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Path explorer</title>
    <style>
      :root { --surface-0: #002b43; --ink: #f2ead4; --ink-muted: #8fe3e8; }
      html, body { margin: 0; height: 100%; background: var(--surface-0); color: var(--ink); }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
             font-family: "Public Sans", system-ui, sans-serif; }
      #game { line-height: 0; }
      #game canvas { image-rendering: pixelated; }
      #status { font-size: 13px; color: var(--ink-muted); }
      #status[hidden] { display: none; }
      #stage { position: relative; }
      #splash { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
      #splash[hidden] { display: none; }
      #bubbles { position: absolute; inset: 0; overflow: hidden; }
      .bubble { position: absolute; left: 0; white-space: nowrap; padding: 9px 26px; background: #c4c8cc; color: #14212b;
                font-size: 15px; line-height: 1.3; will-change: transform;
                clip-path: polygon(13px 0, calc(100% - 13px) 0, 100% 50%, calc(100% - 13px) 100%, 13px 100%, 0 50%); }
      .bubble b { font-weight: 700; margin-right: 8px; }
      .bubble.parked { left: 50%; transform: translate(-50%, -50%); font-weight: 600; font-size: 17px; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: pre-line; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="game"></div>
      <div id="splash">
        <div id="bubbles" aria-hidden="true"></div>
        <div id="splash-text" class="sr-only" role="status"></div>
      </div>
    </div>
    <div id="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
