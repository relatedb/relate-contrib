<!doctype html>
<meta charset="utf-8" />
<title>SPIKE-008 harness</title>
<script type="module">
  const W = {};
  window.spawn = (key) => {
    const w = new Worker("/worker.js", { type: "module" });
    const st = { w, acks: 0, last: -1, pending: new Map(), n: 0, ctr: new Int32Array(new SharedArrayBuffer(8)) };
    w.postMessage({ cmd: "attach", sab: st.ctr.buffer, id: -1 });
    w.onmessage = (e) => {
      const m = e.data;
      if (m.type === "ack") { st.acks++; st.last = m.i; return; }
      st.pending.get(m.id)?.(m);
      st.pending.delete(m.id);
    };
    W[key] = st;
  };
  window.call = (key, msg) => new Promise((res) => { const st = W[key]; const id = ++st.n; st.pending.set(id, res); st.w.postMessage({ ...msg, id }); });
  window.send = (key, msg) => { const st = W[key]; st.w.postMessage({ ...msg, id: ++st.n }); };
  window.kill = (key) => W[key].w.terminate();
  window.lastAck = (key) => W[key].last;
  window.completed = (key) => Atomics.load(W[key].ctr, 0);
  // Total size of the files under the origin-private directory, by walking it (works once the handles are released).
  window.opfsBytes = async () => {
    const walk = async (dir) => { let t = 0, files = 0; for await (const [, h] of dir.entries()) { if (h.kind === "file") { t += (await h.getFile()).size; files++; } else { const r = await walk(h); t += r.t; files += r.files; } } return { t, files }; };
    return walk(await navigator.storage.getDirectory());
  };
  window.clearOpfs = async () => {
    const root = await navigator.storage.getDirectory();
    for (let attempt = 0; attempt < 30; attempt++) {
      const names = []; for await (const [n] of root.entries()) names.push(n);
      let left = 0;
      for (const n of names) { try { await root.removeEntry(n, { recursive: true }); } catch { left++; } }
      if (left === 0) return true;
      await new Promise((r) => setTimeout(r, 300));
    }
    return false;
  };
  window.ready = true;
</script>
